<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}The Tome{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block extra_head %}{% endblock %}
  <style>
    /* ── Global Reset & Base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:        #0d0a07;
      --parchment:  #f2e8d5;
      --parchment2: #e8d9bc;
      --aged:       #c9a96e;
      --gold:       #c8973a;
      --gold-light: #e8b84b;
      --crimson:    #8b1a1a;
      --crimson2:   #6b1212;
      --shadow:     rgba(0,0,0,0.7);
      --glow:       rgba(200,151,58,0.3);
      --bg:         #111008;
      --bg2:        #1a1508;
      --border:     #3d2f0e;
      --text-dim:   #9a8060;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Crimson Text', Georgia, serif;
      background-color: var(--bg);
      color: var(--parchment);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(139,26,26,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(200,151,58,0.06) 0%, transparent 60%),
        url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* ── Top Nav ───────────────────────────────────────────────────── */
    .site-nav {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(180deg, #0d0a07 0%, rgba(13,10,7,0.97) 100%);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; gap: 2rem;
      box-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }

    .site-nav .brand {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.1rem;
      color: var(--gold);
      text-decoration: none;
      padding: 1rem 0;
      letter-spacing: 0.05em;
      white-space: nowrap;
      text-shadow: 0 0 20px var(--glow);
    }

    .site-nav .brand span { color: var(--crimson); }

    .nav-links {
      display: flex; gap: 0.25rem;
      list-style: none;
      margin-left: auto;
    }

    .nav-links a {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 3px;
      transition: color 0.2s, background 0.2s;
      position: relative;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--gold-light);
      background: rgba(200,151,58,0.08);
    }

    .nav-links a.active::after {
      content: '';
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 30px; height: 2px;
      background: var(--gold);
      border-radius: 2px;
    }

    /* ── Page wrapper ──────────────────────────────────────────────── */
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    /* ── Page heading ──────────────────────────────────────────────── */
    .page-heading {
      text-align: center;
      padding: 3rem 0 2rem;
      position: relative;
    }

    .page-heading h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      color: var(--gold);
      text-shadow: 0 0 40px var(--glow), 0 2px 4px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    .page-heading p {
      font-family: 'Crimson Text', serif;
      font-style: italic;
      color: var(--text-dim);
      font-size: 1.15rem;
      margin-top: 0.5rem;
    }

    .divider {
      display: flex; align-items: center; gap: 1rem;
      margin: 1.5rem auto;
      max-width: 400px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent);
    }
    .divider-gem {
      width: 8px; height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 8px var(--glow);
    }

    /* ── Card ──────────────────────────────────────────────────────── */
    .card {
      background: linear-gradient(135deg, #1e1708 0%, #160f05 100%);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(200,151,58,0.1);
    }

    .card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 4px;
      background: linear-gradient(135deg, rgba(200,151,58,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── Buttons ───────────────────────────────────────────────────── */
    .btn {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none; cursor: pointer;
      padding: 0.65rem 1.5rem;
      border-radius: 3px;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 0.5rem;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson2) 100%);
      color: var(--parchment);
      border: 1px solid #a02020;
      box-shadow: 0 2px 12px rgba(139,26,26,0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #a52020 0%, #7a1515 100%);
      box-shadow: 0 4px 20px rgba(139,26,26,0.6);
      transform: translateY(-1px);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, #a07020 100%);
      color: var(--ink);
      border: 1px solid var(--gold-light);
      box-shadow: 0 2px 12px rgba(200,151,58,0.3);
      font-weight: 600;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
      box-shadow: 0 4px 20px rgba(200,151,58,0.5);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      color: var(--gold-light);
      border-color: var(--gold);
      background: rgba(200,151,58,0.05);
    }

    .btn-danger {
      background: linear-gradient(135deg, #5a1010 0%, #3d0a0a 100%);
      color: #e88;
      border: 1px solid #6b1212;
    }
    .btn-danger:hover {
      background: linear-gradient(135deg, #6b1212 0%, #4d0c0c 100%);
      color: #ffaaaa;
    }

    /* ── Form elements ─────────────────────────────────────────────── */
    label {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: block;
      margin-bottom: 0.4rem;
    }

    input[type=text], input[type=number], select, textarea {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--parchment);
      font-family: 'Crimson Text', serif;
      font-size: 1rem;
      padding: 0.5rem 0.75rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(200,151,58,0.15);
    }

    select option { background: #1a1508; }

    /* ── Ornamental section title ───────────────────────────────────── */
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .section-title::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    /* ── Flash messages ────────────────────────────────────────────── */
    .flash { padding: 0.75rem 1rem; border-radius: 3px; margin-bottom: 1rem; font-size: 0.95rem; }
    .flash-success { background: rgba(40,100,40,0.3); border: 1px solid #2d6b2d; color: #8fcc8f; }
    .flash-error   { background: rgba(100,20,20,0.3); border: 1px solid #6b1212; color: #e08080; }
    .flash-info    { background: rgba(40,60,100,0.3); border: 1px solid #2d4a6b; color: #80a8e0; }

    /* ── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .site-nav { flex-wrap: wrap; padding: 0.5rem 1rem; gap: 0.5rem; }
      .nav-links { margin-left: 0; flex-wrap: wrap; }
      .page-wrap { padding: 1rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="{{ url_for('home_page') }}" class="brand">The <span>&</span> Tome</a>
  <ul class="nav-links">
    <li><a href="{{ url_for('home_page') }}"         class="{{ 'active' if request.endpoint == 'home_page' }}">Home</a></li>
    <li><a href="{{ url_for('character_builder') }}" class="{{ 'active' if request.endpoint == 'character_builder' }}">Builder</a></li>
    <li><a href="{{ url_for('characters_list') }}"   class="{{ 'active' if request.endpoint in ['characters_list','character_detail','character_levelup'] }}">Characters</a></li>
    <li><a href="{{ url_for('dice_roller') }}"        class="{{ 'active' if request.endpoint == 'dice_roller' }}">Dice</a></li>
  </ul>
</nav>

<div class="page-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
