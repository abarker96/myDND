{% extends "base.html" %}
{% block title %}Login — The Tome{% endblock %}
{% block extra_head %}
<style>
.auth-wrap{max-width:420px;margin:4rem auto;padding:0 1rem}
.auth-wrap .page-heading{padding:2rem 0 1.5rem}
.auth-footer{text-align:center;margin-top:1.25rem;font-family:'Crimson Text',serif;font-style:italic;color:var(--text-dim)}
.auth-footer a{color:var(--gold);text-decoration:none}
.auth-footer a:hover{color:var(--gold-light)}
.field-row{margin-bottom:1rem}
.form-actions{display:flex;align-items:center;justify-content:space-between;margin-top:1.5rem;gap:1rem}
.remember-row{display:flex;align-items:center;gap:.5rem;font-family:'Crimson Text',serif;color:var(--text-dim);font-size:.95rem;cursor:pointer}
.remember-row input{accent-color:var(--gold);width:15px;height:15px}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="page-heading">
    <h1>⚔ Enter the Tome</h1>
    <p>Sign in to your account</p>
    <div class="divider"><div class="divider-gem"></div></div>
  </div>
  <div class="card">
    <form method="POST">
      <div class="field-row">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus
               value="{{ request.form.get('username','') }}">
      </div>
      <div class="field-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <div class="form-actions">
        <label class="remember-row">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <button type="submit" class="btn btn-gold" style="padding:.65rem 2rem">Sign In</button>
      </div>
    </form>
  </div>
  <p class="auth-footer">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
